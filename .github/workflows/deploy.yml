name: GitHub Pages ve APK Derleme Hazırlığı

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Bağımlılıkları Yükle
        run: npm ci
      - name: Uygulamayı Derle
        run: npm run build
      - name: Pages Artifact Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
