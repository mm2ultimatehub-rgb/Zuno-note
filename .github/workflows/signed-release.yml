name: Zuno Note Signed Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.2.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version from release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="$REF_NAME"; fi
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          if not match:
              raise SystemExit("Tag must use semantic version format, for example v1.2.1")
          major, minor, patch = map(int, match.groups())
          code = major * 1000000 + minor * 1000 + patch
          path = "android/app/build.gradle"
          text = open(path, encoding="utf-8").read()
          text, count_code = re.subn(r"versionCode\s+\d+", f"versionCode {code}", text, count=1)
          text, count_name = re.subn(r"versionName\s+['\"]([^'\"]*)['\"]", f'versionName "{version}"', text, count=1)
          if count_code != 1 or count_name != 1:
              raise SystemExit("Could not safely locate versionCode/versionName in generated app/build.gradle")
          open(path, "w", encoding="utf-8").write(text)
          print(f"Android version set to {version} (versionCode {code})")
          PY

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          mkdir -p "$RUNNER_TEMP/zuno-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zuno-signing/release.jks"
          test -s "$RUNNER_TEMP/zuno-signing/release.jks"

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_FILE: ${{ runner.temp }}/zuno-signing/release.jks
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          cat >> android/app/build.gradle <<'GRADLE'

          // Zuno Note CI release signing; credentials are supplied by GitHub Actions secrets.
          android {
              signingConfigs {
                  zunoRelease {
                      storeFile file(System.getenv("STORE_FILE"))
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.zunoRelease
                  }
              }
          }
          GRADLE

      - name: Build signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          jarsigner -verify -verbose -certs "$APK" >/dev/null
          cp "$APK" "$GITHUB_WORKSPACE/Zuno-Note-release.apk"

      - name: Determine release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="$REF_NAME"; fi
          test -n "$TAG" || (echo "A release tag is required" && exit 1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Zuno Note ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: Zuno-Note-release.apk
          fail_on_unmatched_files: true
