name: Zuno Note Signed Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag; leave blank to auto-increment"
        required: false
        type: string
  push:
    branches: [main, master]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: zuno-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve release version automatically
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == v* ]]; then TAG="$REF_NAME"; fi
          if [ -z "$TAG" ]; then
            LATEST="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
            VERSION="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            TAG="v$MAJOR.$MINOR.$((PATCH + 1))"
            echo "Automatically selected next release: $TAG"
          fi
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import re, sys
          if not re.fullmatch(r"\d+\.\d+\.\d+", sys.argv[1]):
              raise SystemExit("Release tag must use semantic version format, e.g. v1.2.2")
          PY
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript validation
        run: npm run lint

      - name: Build web assets
        env:
          VITE_APP_VERSION: ${{ env.RELEASE_VERSION }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Zuno Note app icons
        run: |
          mkdir -p assets
          cp public/icon.svg assets/icon.svg
          npx --yes @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#101114' --iconBackgroundColorDark '#101114' --splashBackgroundColor '#101114'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version from calculated release tag
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          if not match:
              raise SystemExit("Tag must use semantic version format, for example v1.2.1")
          major, minor, patch = map(int, match.groups())
          code = major * 1000000 + minor * 1000 + patch
          path = "android/app/build.gradle"
          text = open(path, encoding="utf-8").read()
          text, count_code = re.subn(r"versionCode\s+\d+", f"versionCode {code}", text, count=1)
          text, count_name = re.subn(r"versionName\s+['\"]([^'\"]*)['\"]", f'versionName "{version}"', text, count=1)
          if count_code != 1 or count_name != 1:
              raise SystemExit("Could not safely locate versionCode/versionName in generated app/build.gradle")
          open(path, "w", encoding="utf-8").write(text)
          print(f"Android version set to {version} (versionCode {code})")
          PY

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          mkdir -p "$RUNNER_TEMP/zuno-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zuno-signing/release.jks"
          test -s "$RUNNER_TEMP/zuno-signing/release.jks"

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_FILE: ${{ runner.temp }}/zuno-signing/release.jks
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          cat >> android/app/build.gradle <<'GRADLE'

          // Zuno Note CI release signing; credentials are supplied by GitHub Actions secrets.
          android {
              signingConfigs {
                  zunoRelease {
                      storeFile file(System.getenv("STORE_FILE"))
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.zunoRelease
                  }
              }
          }
          GRADLE

      - name: Build signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_FILE: ${{ runner.temp }}/zuno-signing/release.jks
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          # Verify the final Android APK with Android's official signature verifier.
          # This does not bypass Play Protect; it catches malformed or wrongly signed releases.
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER" || (echo "Android apksigner not found" && exit 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/zuno-apk-signature.txt"
          grep -q "Verified using v2 scheme" "$RUNNER_TEMP/zuno-apk-signature.txt"
          grep -q "Signer #1 certificate SHA-256 digest:" "$RUNNER_TEMP/zuno-apk-signature.txt"
          cp "$APK" "$GITHUB_WORKSPACE/Zuno-Note-release.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum Zuno-Note-release.apk > Zuno-Note-release.apk.sha256

      - name: Determine release tag
        id: release
        run: echo "tag=${{ env.RELEASE_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Zuno Note ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            Zuno-Note-release.apk
            Zuno-Note-release.apk.sha256
          fail_on_unmatched_files: true
